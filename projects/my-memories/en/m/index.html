            <p class="game-title prewrap">

              <span class="star ani" data-idx="2"><img src="assets/img/game-title-star.png" alt=""></span>

              <span class="star ani" data-idx="4"><img src="assets/img/game-title-star.png" alt=""></span>

              <span class="star ani" data-idx="6"><img src="assets/img/game-title-star.png" alt=""></span>

            </div>
          </div>
          <div class="scene" id="howto" data-type="pop">
            <div class="pop">
              <img src="assets/img/en/game-howtoplay.png" alt="">
              <button type="button" id="btn_close_howto"><img src="assets/img/game-btn-close.png" alt="Close"></button>
            </div>
          </div>
          <div class="scene" id="select">
            <p class="title">
              <img src="assets/img/game-select-title.png" alt="">

            <div class="icon-grid">
              <button id="btn_character_0" class="grid-item" data-row="0" data-col="0" data-no="0"><span><img src="assets/img/game-select-icon-01.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_1" class="grid-item" data-row="0" data-col="1" data-no="1"><span><img src="assets/img/game-select-icon-02.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_2" class="grid-item" data-row="0" data-col="2" data-no="2"><span><img src="assets/img/game-select-icon-03.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_3" class="grid-item" data-row="0" data-col="3" data-no="3"><span><img src="assets/img/game-select-icon-04.png" alt=""></span><i class="stamp"></i></button>

              <button id="btn_character_5" class="grid-item" data-row="1" data-col="1" data-no="5"><span><img src="assets/img/game-select-icon-06.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_6" class="grid-item" data-row="1" data-col="2" data-no="6"><span><img src="assets/img/game-select-icon-07.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_7" class="grid-item" data-row="1" data-col="3" data-no="7"><span><img src="assets/img/game-select-icon-08.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_8" class="grid-item" data-row="2" data-col="0" data-no="8"><span><img src="assets/img/game-select-icon-09.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_9" class="grid-item" data-row="2" data-col="1" data-no="9"><span><img src="assets/img/game-select-icon-10.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_10" class="grid-item" data-row="2" data-col="2" data-no="10"><span><img src="assets/img/game-select-icon-11.png" alt=""></span><i class="stamp"></i></button>
              <button id="btn_character_11" class="grid-item" data-row="2" data-col="3" data-no="11"><span><img src="assets/img/game-select-icon-12.png" alt=""></span><i class="stamp"></i></button>

          </div>
          <div class="scene" id="play">
            <div class="hud-overlay">
              <div class="hud-time">
                <span class="hud-time-label"><img src="assets/gameui/text_time.png"></span>
                <span id="hud-time-value" class="hud-time-value">120</span>
              </div>
              <div class="hud-gauge">
                <div class="hud-gauge-track">
                  <div id="hud-gauge-fill" class="hud-gauge-fill"></div>

                <span id="hud-gauge-percent" class="hud-gauge-percent">0%</span>

            <div id="game-container">
              <canvas id="game"></canvas>
            </div>
          </div>
          <div class="scene" id="clear" data-type="pop">
            <div class="clear-bg back">

              <span class="light l2"><img src="assets/img/game-clear-bg-light.png" alt=""></span>
            </div>
            <div class="effect">
              <span class="bokeh"><img src="assets/img/m_game-clear-bokeh.png" alt=""></span>
              <span class="star ani" data-idx="1"><img src="assets/img/game-clear-star.png" alt=""></span>
              <span class="star ani" data-idx="2"><img src="assets/img/game-clear-star.png" alt=""></span>

              <span class="star ani" data-idx="6"><img src="assets/img/game-clear-star.png" alt=""></span>
              <span class="star ani" data-idx="7"><img src="assets/img/game-clear-star.png" alt=""></span>
              <span class="star ani" data-idx="8"><img src="assets/img/game-clear-star.png" alt=""></span>
              <span class="star ani" data-idx="9"><img src="assets/img/game-clear-star.png" alt=""></span>

              <p class="record current"><img src="assets/img/game-clear-record.png" alt="Time">

              </p>
              <p class="record best"><img src="assets/img/game-clear-record-best.png" alt="Best Time">
                <span id="bestTimeValue" data-text="99">99</span>
              </p>
            </div>
            <div class="btns">
              <button type="button" id="btn_clear_redo" lang="en"><img src="assets/img/en/game-btn-select.png" alt="Select Character"></button>
            </div>
          </div>
          <div class="scene" id="fail" data-type="pop">
            <div class="scene-inner">
              <p class="fail-message"><img src="assets/img/game-fail-message-1.png" alt="Crushed!" id="failMsg"></p>
              <div class="btns">
                <button type="button" id="btn_replay" lang="en"><img src="assets/img/en/game-btn-replay.png" alt="Replay"></button>
                <button type="button" id="btn_fail_redo" lang="en"><img src="assets/img/en/game-btn-select.png" alt="Select Character"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="copyright">
      <img src="assets/img/copyright.png" alt="Copyright">
