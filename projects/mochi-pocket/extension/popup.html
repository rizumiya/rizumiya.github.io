<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Mochi Pocket Extension</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111424;
      color: #f8fafc;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ec4899;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version {
      font-size: 0.65rem;
      color: #94a3b8;
    }
    .card {
      background: #1e2238;
      border: 1.5px solid #2e3557;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .pet-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .pet-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
    }
    .pet-badge {
      font-size: 0.72rem;
      font-weight: 800;
      background: #ec4899;
      color: #ffffff;
      padding: 2px 7px;
      border-radius: 99px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 5px;
      color: #cbd5e1;
    }
    .stat-bar-bg {
      width: 140px;
      height: 7px;
      background: #0f1221;
      border-radius: 99px;
      overflow: hidden;
    }
    .stat-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .fill-hunger { background: #f59e0b; }
    .fill-happy { background: #ec4899; }
    .fill-energy { background: #3b82f6; }
    .fill-exp { background: #eab308; }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 0.78rem;
      color: #e2e8f0;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #334155;
      transition: 0.2s;
      border-radius: 99px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #ec4899;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .btn-action-full {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #3b82f6;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-action-full:hover {
      background: #3b82f6;
      color: #ffffff;
    }

    .btn-import-mod {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }
    .btn-import-mod:hover {
      background: #10b981;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🐾 Mochi Pocket</div>
    <span class="version">v2.0</span>
  </div>

  <!-- Profil Pet -->
  <div class="card">
    <div class="pet-info-row">
      <span class="pet-name" id="popup-pet-name">Eri</span>
      <span class="pet-badge" id="popup-pet-lvl">Lv.1</span>
    </div>

    <div class="stat-row">
      <span>🍙 Kenyang</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-hunger" id="bar-hunger" style="width: 80%;"></div></div>
      <span id="txt-hunger">80%</span>
    </div>
    <div class="stat-row">
      <span>💖 Bahagia</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-happy" id="bar-happy" style="width: 90%;"></div></div>
      <span id="txt-happy">90%</span>
    </div>
    <div class="stat-row">
      <span>⚡ Energi</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-energy" id="bar-energy" style="width: 85%;"></div></div>
      <span id="txt-energy">85%</span>
    </div>
    <div class="stat-row">
      <span>⭐ EXP</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-exp" id="bar-exp" style="width: 0%;"></div></div>
      <span id="txt-exp">0%</span>
    </div>
  </div>

  <!-- Pengaturan & Fitur Pintar -->
  <div class="card">
    <div class="switch-row">
      <span>Tampilkan Pet Melayang</span>
      <label class="switch">
        <input type="checkbox" id="toggle-floating-pet" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="switch-row">
      <span>Auto-Feeder (Beri Makan Otomatis)</span>
      <label class="switch">
        <input type="checkbox" id="toggle-autofeed" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Tombol Mod & Tautan Konsol -->
  <input type="file" id="file-mod-input" accept=".js,.json" style="display: none;">
  <button type="button" class="btn-action-full btn-import-mod" id="btn-import-mod">
    <span>🎨</span> Impor Mod Kustom (.js / .json)
  </button>
  <button type="button" class="btn-action-full" id="btn-open-web-console">
    <span>🎮</span> Buka Konsol Lengkap di Web
  </button>

  <script src="popup.js"></script>
</body>
</html>
